<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Google Drive - Preview</title>
  <link href="https://googleapis.com" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #111111;
      font-family: 'Roboto', sans-serif;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background-color: #111111;
    }
    .left-nav {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .close-btn {
      font-size: 24px;
      cursor: pointer;
    }
    .pdf-icon {
      background-color: #ea4335;
      color: white;
      font-size: 10px;
      font-weight: bold;
      padding: 2px 4px;
      border-radius: 2px;
    }
    .file-name {
      font-size: 16px;
      font-weight: 400;
    }
    .right-nav {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .icon {
      cursor: pointer;
      opacity: 0.8;
    }
    .sign-in-btn {
      background-color: #1a73e8;
      color: white;
      padding: 8px 16px;
      border-radius: 4px;
      text-decoration: none;
      font-weight: 500;
      font-size: 14px;
    }
    .content-area {
      flex-grow: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .preview-box {
      background-color: #303134;
      border-radius: 8px;
      padding: 32px 24px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    .error-title {
      font-size: 22px;
      margin: 0 0 12px 0;
      font-weight: 400;
    }
    .error-subtitle {
      font-size: 16px;
      color: #bdc1c6;
      margin: 0 0 24px 0;
    }
    .download-btn {
      background-color: #1a73e8;
      color: white;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 24px;
      border-radius: 4px;
      text-decoration: none;
      font-weight: 500;
      font-size: 14px;
    }
    .download-btn:hover {
      background-color: #1557b0;
    }
  </style>
</head>
<body>

      </div>
  <span class="file-name" style="font-size: 26px; margin-left: 20px;">Lacey Shaw</span>

      </div>
    <div class="right-nav">
      <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM17 13l-5 5-5-5h3V9h4v4h3z"/></svg>
      <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
      <a href="#" class="sign-in-btn">Sign in</a>
    </div>
  </div>

  <div class="content-area">
    <div class="preview-box">
      <h1 class="error-title">Could not preview the file</h1>
      <p class="error-subtitle">This file is too large to preview</p>
      <a href="https://example.com" class="download-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM17 13l-5 5-5-5h3V9h4v4h3z"/></svg>
        Download
      </a>
    </div>
  </div>

</body>
</html>
